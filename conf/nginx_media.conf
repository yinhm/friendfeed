### Nginx configuration for the media domain (m.friendfeed.me)
###
### Mirrored media is dual-written to the R2 bucket and to the local media
### directory (config media_path, conventionally <db_path>/files). Both are
### served under the same public domain (config media_url), so this origin
### answers the very URLs rewritten into archived entries, straight from
### disk, without involving ffweb.

server {
        listen 80;
        server_name %(nginx_media_server_name)s;

        access_log /var/log/nginx/%(nginx_media_server_name)s_access.log combined;

        root %(media_path)s;

        location ^~ /upload-staging/ {
                 try_files $uri =404;
                 add_header Cache-Control "no-store" always;
                 add_header X-Content-Type-Options "nosniff" always;
        }

        # New canonical images have a server-derived extension. Keep the
        # extensionless fallback below for historical mirrored objects.
        location ~* \.(?:jpe?g|png|gif|webp)$ {
                 try_files $uri =404;
                 expires 1y;
                 add_header Cache-Control "public, immutable" always;
                 add_header X-Content-Type-Options "nosniff" always;
        }

        # User files are always downloads, including active formats such as
        # HTML and SVG. Their verified MIME remains in Entry metadata; the
        # media origin deliberately serves bytes as opaque attachments.
        location ~* \.(?:svg|pdf|txt|md|markdown|csv|json|xml|html?|rtf|docx?|xlsx?|pptx?|odt|ods|odp|zip|7z|rar|tar|gz|gzip|bz2|xz|mp3|m4a|aac|ogg|opus|flac|wav|wma|mp4|m4v|webm|mov|ogv|mpe?g|mkv|avi|wmv|3gp|epub|mobi|azw)$ {
                 try_files $uri =404;
                 default_type application/octet-stream;
                 types { }
                 add_header Content-Disposition "attachment" always;
                 add_header X-Content-Type-Options "nosniff" always;
                 expires 1y;
                 add_header Cache-Control "public, immutable" always;
        }

        location / {
                 # Historical mirrored keys may be extensionless; preserve
                 # their existing sniffing behavior for compatibility.
                 try_files $uri =404;
        }
}
