### Nginx configuration for the media domain (m.friendfeed.com)
###
### Mirrored media is dual-written to the R2 bucket and to the local media
### directory (config media_path, conventionally <db_path>/files). Both are
### served under the same public domain (config media_url), so this origin
### answers the very URLs rewritten into archived entries, straight from
### disk, without involving ffweb.

server {
        listen 80;
        server_name %(nginx_media_server_name)s;

        access_log /var/log/nginx/%(nginx_media_server_name)s_access.log combined;

        root %(media_path)s;

        location / {
                 # Object keys are sharded relative paths (a/b/rest); anything
                 # not mirrored locally is simply absent.
                 try_files $uri =404;
        }
}
