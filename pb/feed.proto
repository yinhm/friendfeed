syntax = "proto3";

package pb;
option go_package = ".;pb";

message Service {
  string uuid = 1;
  string kind = 2;
  string canonical_url = 3;
  string title = 4;
  string site_url = 5;
  string icon_url = 6;
  int64 created_at_ms = 7;
  int64 updated_at_ms = 8;
}

message ServiceState {
  string service_uuid = 1;
  string etag = 2;
  string last_modified = 3;
  int64 last_fetch_ms = 4;
  int64 next_fetch_ms = 5;
  uint32 consecutive_failures = 6;
  int32 http_status = 7;
  uint32 empty_fetches = 8;
  string last_error = 9;
}

message ServiceFetchPayload {
  string service_uuid = 1;
}

message FeedServiceSeedPayload {
  string service_uuid = 1;
  string target_feed_uuid = 2;
  string service_id = 3;
}

enum FeedType {
  user = 0;
  group = 1;
  special = 2;
}

enum StatusType {
  private = 0;
  public = 1;
}

message OAuthUser {
  string uuid = 1;
  // User info from oauth2 providers
  // sequence
  string user_id = 2;
  // login
  string name = 3;
  string nick_name = 4;
  string avater_url = 5;
  string email = 6;
  string access_token = 7;
  string access_token_secret = 10;
  string provider = 8;

  string avatar_url = 11;
  string description = 12;
}

// id map
message Profile {
  // the FriendFeed UUID
  string uuid = 1;
  // v1 nickname or v2 id, in URL
  string id = 2; 
  // the user's full name, display name
  string name = 3;
  string picture = 9;
  // One of "user", "group", or "special"
  string type = 4;
  // true if the feed is private
  bool private = 5;
  string description = 7;
  
  // mark deletion, will purge all related data later
  bool deleted = 10;
  // super admin
  bool is_super = 11;
}

// social graph
message Graph {
  map<string, Profile> following = 1;
  map<string, Profile> followers = 2;
  map<string, Profile> admins = 3;
  map<string, Profile> feeds = 4;
  map<string, FeedService> services = 5;
}

message FollowRequest {
  string profile_uuid = 1;
  string feed_uuid = 2;
  string action = 3;
}

message FollowResponse {
  bool followed = 1;
}

// Feed
// id - The feed id, e.g., "bret" or "bret/comments"
// name - Display name of the feed, e.g., "Bret Taylor"
// sup_id - Simple Update Protocol
// description? - Profile description, an HTML string
// type - One of "user", "group", or "special"
// private - true if the feed is private.
// commands[]? - List of allowed commands for the authenticated user on this feed: "subscribe", "unsubscribe", "post", "dm", "admin"
//
// Full feeds have all of the fields above, plus the following field:
// entries[]{} - List of the entries in this feed.
message Feed {
  string uuid = 1;
  string id = 2;
  string name = 3;
  string picture = 4;
  string description = 5;
  // One of "user", "group", or "special"
  string type = 6;
  // true if the feed is private
  bool private = 7;
  repeated string commands = 8;
  repeated Entry entries = 9;
  // Opaque positions used only by cursor-paged profile and timeline feeds.
  string next_cursor = 10;
}

// /feedinfo - Feed information
// Return information about the feed with the specified feed id:
// 
// http://friendfeed-api.com/v2/feedinfo/feed id
// 
// The response is a feed, plus the following fields:
// 
// subscriptions[]? - The users and groups this feed is subscribed to
// subscribers[]? - The users subscribed to this feed
// admins[]{}? - For groups, the list of group administrators
// feeds[]? - For special feeds, the feeds that are contained within this feed. For example, for a friend list feed, this property lists all of the users/groups in the friend list.
// services[]{}? - Services associated with the feed (e.g., Twitter or an imported blog)
//   * id - the service's id, e.g., "picasa"
//   * name - the service's official name, e.g., "Picasa Web Albums"
//   * url - the official URL of the service, e.g., "http://picasaweb.google.com/"
//   * icon - the URL of the favicon for this service
//   * profile? - the profile URL for this service, if any
//   * username? - the username for this service, if any
message Feedinfo {
  // Feed
  string uuid = 1;
  string id = 2;
  string name = 3;
  string picture = 4;
  string description = 5;
  // One of "user", "group", or "special"
  string type = 6;
  // true if the feed is private
  bool private = 7;
  repeated string commands = 8;
  repeated Entry entries = 9;

  // Feedinfo
  repeated Profile following = 10;
  repeated Profile followers = 11;
  repeated Profile admins = 12;
  repeated Profile feeds = 13; // for list
  repeated FeedService services = 14;
}

// not really used
// see: server.GraphFollow
message Follow {
  string id = 1;
  string name = 2;
  string type = 3;
}

message Follower {
  string id = 1;
  string name= 2;
  string type = 3;
}

// message Admin {
//   string id = 1;
//   string name = 2;
//   string type = 3;
// }

// services[]{}? - Services associated with the feed (e.g., Twitter or an imported blog)
//   * id - the service's id, e.g., "picasa"
//   * name - the service's official name, e.g., "Picasa Web Albums"
//   * url - the official URL of the service, e.g., "http://picasaweb.google.com/"
//   * icon - the URL of the favicon for this service
//   * profile? - the profile URL for this service, if any
//   * username? - the username for this service, if any
message FeedService {
  string id = 1;
  string name = 2;
  string icon = 3;
  string profile = 4;
  string username = 5;
  OAuthUser oauth = 6;
  int64 created = 7;
  int64 updated = 8;
  string kind = 9;
  string service_uuid = 10;
  bool enabled = 11;
  string added_by_uuid = 12;
  string authorized_by_uuid = 13;
}

