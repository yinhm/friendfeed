syntax = "proto3";

package pb;
option go_package = ".;pb";

import "feed.proto";
import "google/protobuf/empty.proto";

service Api {
  rpc EnqueueTask(EnqueueTaskRequest) returns (EnqueueTaskResponse) {}
  rpc ClaimTasks(ClaimTasksRequest) returns (ClaimTasksResponse) {}
  rpc CompleteTask(CompleteTaskRequest) returns (google.protobuf.Empty) {}
  rpc FailTask(FailTaskRequest) returns (FailTaskResponse) {}
  rpc RenewTaskLease(RenewTaskLeaseRequest) returns (Task) {}

  rpc FetchProfile(ProfileRequest) returns (Profile) {}
  rpc FetchGraph(ProfileRequest) returns (Graph) {}
  rpc GraphFollow(FollowRequest) returns (FollowResponse) {}

  // rpc FetchFeedinfo(ProfileRequest) returns (Feedinfo) {}
  rpc PostFeedinfo(Feedinfo) returns (Profile) {}

  // A client-to-server streaming RPC.
  //
  // Accepts a stream of Entries on a feed being archived, returning a
  // FeedSummary when archving is completed.
  rpc ArchiveFeed(stream Entry) returns (FeedSummary) {}
  rpc ForceArchiveFeed(stream Entry) returns (FeedSummary) {}

  rpc FetchFeed(FeedRequest) returns (Feed) {}
  rpc FetchInteractionFeed(InteractionFeedRequest) returns (InteractionFeedResponse) {}

  // Entry page return Feed as well
  rpc FetchEntry(EntryRequest) returns (Feed) {}
  rpc PostEntry(Entry) returns (Entry) {}
  rpc PostTweet(Tweet) returns (Entry) {}
  rpc DeleteEntry(EntryRequest) returns (EntryRequest) {}
  rpc LikeEntry(LikeRequest) returns (Entry) {}
  rpc CommentEntry(CommentRequest) returns (Entry) {}
  rpc DeleteComment(CommentDeleteRequest) returns (Entry) {}
  rpc Search(SearchRequest) returns (Feed) {}

  rpc PutOAuth(OAuthUser) returns (Profile) {}
  // rpc BindAuth(OAuthUser) returns (OAuthUser) {}
  rpc BindUserFeed(OAuthUser) returns (OAuthUser) {}

  // service
  rpc AddFeedService(AddFeedServiceRequest) returns (FeedService) {}
  rpc RemoveFeedService(RemoveFeedServiceRequest) returns (google.protobuf.Empty) {}
  rpc ListFeedServices(ListFeedServicesRequest) returns (ListFeedServicesResponse) {}
  rpc SetFeedServiceEnabled(SetFeedServiceEnabledRequest) returns (FeedService) {}
  rpc RefreshFeedService(RefreshFeedServiceRequest) returns (google.protobuf.Empty) {}

  // group
  rpc CreateGroup(CreateGroupRequest) returns (Profile) {}
  rpc JoinGroup(GroupMembershipRequest) returns (google.protobuf.Empty) {}
  rpc LeaveGroup(GroupMembershipRequest) returns (google.protobuf.Empty) {}
  rpc AddGroupAdmin(GroupMembershipRequest) returns (google.protobuf.Empty) {}
  rpc RemoveGroupAdmin(GroupMembershipRequest) returns (google.protobuf.Empty) {}
  rpc RemoveGroupMember(GroupMembershipRequest) returns (google.protobuf.Empty) {}
  rpc UpdateGroup(UpdateGroupRequest) returns (Profile) {}
  rpc DeleteGroup(DeleteGroupRequest) returns (google.protobuf.Empty) {}
  rpc GetGroup(GetGroupRequest) returns (GroupView) {}
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse) {}
  rpc ListUserGroups(ListUserGroupsRequest) returns (ListUserGroupsResponse) {}
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse) {}

  rpc RequestFollow(RequestFollowRequest) returns (RequestFollowResponse) {}
  rpc CancelFollowRequest(RequestFollowRequest) returns (google.protobuf.Empty) {}
  rpc ApproveFollowRequest(FollowRequestAction) returns (google.protobuf.Empty) {}
  rpc RejectFollowRequest(FollowRequestAction) returns (google.protobuf.Empty) {}
  rpc ListFollowRequests(ListFollowRequestsRequest) returns (ListFollowRequestsResponse) {}

  rpc GetFeedApiKeyStatus(FeedApiKeyManageRequest) returns (FeedApiKeyStatusResponse) {}
  rpc GenerateFeedApiKey(FeedApiKeyManageRequest) returns (FeedApiKeyMutationResponse) {}
  rpc RotateFeedApiKey(FeedApiKeyManageRequest) returns (FeedApiKeyMutationResponse) {}
  rpc RevokeFeedApiKey(FeedApiKeyManageRequest) returns (FeedApiKeyStatusResponse) {}
  rpc AuthenticateFeedApiKey(AuthenticateFeedApiKeyRequest) returns (AuthenticateFeedApiKeyResponse) {}

  rpc Command(CommandRequest) returns (CommandResponse) {}

}

enum TaskState {
  TASK_STATE_UNSPECIFIED = 0;
  TASK_STATE_READY = 1;
  TASK_STATE_INFLIGHT = 2;
}

enum TaskCompletionStatus {
  TASK_COMPLETION_STATUS_UNSPECIFIED = 0;
  TASK_COMPLETION_STATUS_OK = 1;
  TASK_COMPLETION_STATUS_DEAD = 2;
}

enum FailTaskOutcome {
  FAIL_TASK_OUTCOME_UNSPECIFIED = 0;
  FAIL_TASK_OUTCOME_RETRY = 1;
  FAIL_TASK_OUTCOME_DEAD = 2;
}

message Task {
  string id = 1;
  string type = 2;
  bytes payload = 3;
  uint32 payload_version = 4;
  string idempotency_key = 5;
  TaskState state = 6;
  int64 run_at_ms = 7;
  uint32 attempts = 8;
  uint32 max_attempts = 9;
  int64 lease_until_ms = 10;
  string leased_by = 11;
  uint64 lease_epoch = 12;
  string last_error = 13;
  int64 created_at_ms = 14;
  int64 updated_at_ms = 15;
  int64 claimed_at_ms = 16;
}

message TaskCompletion {
  Task task = 1;
  TaskCompletionStatus status = 2;
  string last_error = 3;
  int64 finished_at_ms = 4;
}

message EnqueueTaskRequest {
  string type = 1;
  bytes payload = 2;
  uint32 payload_version = 3;
  string idempotency_key = 4;
  int64 run_at_ms = 5;
}

message EnqueueTaskResponse {
  Task task = 1;
  bool already_exists = 2;
}

message ClaimTasksRequest {
  string worker_id = 1;
  repeated string types = 2;
  uint32 max_tasks = 3;
}

message ClaimTasksResponse {
  repeated Task tasks = 1;
}

message CompleteTaskRequest {
  string worker_id = 1;
  string task_id = 2;
  uint64 lease_epoch = 3;
}

message FailTaskRequest {
  string worker_id = 1;
  string task_id = 2;
  uint64 lease_epoch = 3;
  string error = 4;
}

message FailTaskResponse {
  FailTaskOutcome outcome = 1;
  int64 next_run_at_ms = 2;
}

message RenewTaskLeaseRequest {
  string worker_id = 1;
  string task_id = 2;
  uint64 lease_epoch = 3;
}

message FeedSummary {
  string id = 1;
  int32 entry_count = 2;
  string date_start = 3;
  string date_end = 4;
  int32 elapsed_time = 5;
}

message CommandRequest {
  string command = 1;
  string arg1 = 2;
  string arg2 = 3;
}

message CommandResponse {
  string command = 1;
  string result = 2;
}

// Collapsing comments and likes
// Many entries on FriendFeed have 100s or even 1000s of comments and likes. Retrieving and displaying all comments and likes for all feeds in your application can greatly reduce performance and usability. On FriendFeed, we display only a subset of the comments and likes for each entry along with links to expand the "collapsed" view to show the entire set of comments/likes. We support the maxcomments and maxlikes arguments for all feed requests to make this technique easy to support in your application as well:

// maxcomments=limit - If limit is 0, then do not include any comments. If limit is auto, then return the same number of comments as displayed by default on friendfeed.com.
// maxlikes=limit - If limit is 0, then do not include any likes. If limit is auto, then return the same number of likes as displayed by default on friendfeed.com.
// For example, if you specify maxcomments=2 in your request, rather than getting this response:

// "comments": [
//   {"body":"First comment", "from":  {"id":"bret", "name":"Bret Taylor"}},
//   {"body":"Second comment", "from":  {"id":"jim", "name":"Jim Norris"}},
//   {"body":"Third comment", "from":  {"id":"sanjeev", "name":"Sanjeev Singh"}},
//   {"body":"Fourth comment", "from":  {"id":"paul", "name":"Paul Buchheit"}},
//   {"body":"Fifth comment", "from":  {"id":"ana", "name":"Ana Yang"}}
// ]
// you would get this "collapsed" response:

// "comments": [
//   {"body":"First comment", "from":  {"id":"bret", "name":"Bret Taylor"}},
//   {"body":"3 more comments", "placeholder": true, "num": 3}},
//   {"body":"Fifth comment", "from":  {"id":"ana", "name":"Ana Yang"}}
// ]
// If the maxcomments or maxlikes parameters are specified, then a placeholder field is included in the comments and likes lists for returned entries indicating where comments were excluded. The placeholder has the form:

// placeholder - Always true, indicating the entity is the placeholder
// body - The text we use for the placeholder on FriendFeed, e.g., "3 more comments" for comments or "234 other people" for likes
// num - The number of comments or likes excluded. For example, if the body is "3 more comments", then num would be 3.
// Example: http://friendfeed-api.com/v2/feed/bret?maxcomments=auto&maxlikes=auto
message FeedRequest {
  string id = 1;
  int32 start = 2;
  int32 page_size = 3;
  // Include raw text entry and comment bodies in addition to the HTML bodies
  // included by default. The raw text bodies are available as rawBody on all
  // returned entries and comments. This also adds rawLink on all entries.
  bool raw = 4;
  // NOTICE: this is not the same as original friendfeed api
  // auto should be default it not set.
  // if max_comments set to 1, then all comments should returned.
  int32 max_comments = 5;
  int32 max_likes = 6;
  string profile_uuid = 7;
  // Cursor pagination is opt-in so existing Start/PageSize callers keep their
  // historical behavior. Cursor values are opaque to clients.
  string cursor = 8;
  bool cursor_paging = 9;
  // UUID of the user viewing this feed. Used for private group access control.
  // Optional for backwards compatibility; if empty, assumes public access only.
  string viewer_uuid = 10;
}

enum InteractionKind {
  INTERACTION_KIND_UNSPECIFIED = 0;
  INTERACTION_KIND_LIKE = 1;
  INTERACTION_KIND_COMMENT = 2;
}

message InteractionFeedRequest {
  string profile_uuid = 1;
  InteractionKind kind = 2;
  string cursor = 3;
  int32 page_size = 4;
  string viewer_uuid = 5;
}

message InteractionItem {
  Entry entry = 1;
  Like like = 2;
  Comment latest_comment = 3;
}

message InteractionFeedResponse {
  Profile profile = 1;
  repeated InteractionItem items = 2;
  string next_cursor = 3;
}

message EntryRequest {
  string uuid = 1;
  string user = 2;
  // UUID of the user viewing this entry. Used for private group access control.
  // Optional for backwards compatibility; if empty, assumes public access only.
  string viewer_uuid = 3;
}

message ProfileRequest {
  string uuid = 1;
  // Resolve by profile ID when uuid is empty.
  string id = 2;
}

message LikeRequest {
  string entry = 1;
  string user = 2;
  bool like = 3;
}

message CommentRequest {
  string entry = 1;
  Comment comment = 2;
  string user_uuid = 3;  // stable principal; required, client From is not trusted
}

message CommentDeleteRequest {
  string entry = 1;
  string comment = 2;
  string user = 3;       // legacy profile ID; kept for wire compat, not an authz fallback
  string user_uuid = 4;  // stable principal; required
}

message AddFeedServiceRequest {
  string actor_uuid = 1;
  string target_feed_uuid = 2;
  string kind = 3;
  string url = 4;
}

message RemoveFeedServiceRequest {
  string actor_uuid = 1;
  string target_feed_uuid = 2;
  string service_id = 3;
}

message ListFeedServicesRequest {
  string actor_uuid = 1;
  string target_feed_uuid = 2;
}

message ListFeedServicesResponse {
  repeated FeedService services = 1;
  map<string, ServiceState> states = 2;
}

message SetFeedServiceEnabledRequest {
  string actor_uuid = 1;
  string target_feed_uuid = 2;
  string service_id = 3;
  bool enabled = 4;
}

message RefreshFeedServiceRequest {
  string actor_uuid = 1;
  string target_feed_uuid = 2;
  string service_id = 3;
}

message SearchRequest {
  string query = 1;
  int32 start = 2;
  int32 page_size = 3;
  // viewer_uuid carries the session user so private-Group results can be
  // filtered server-side per docs/group.md; empty means anonymous.
  string viewer_uuid = 4;
}

message CreateGroupRequest {
  string actor_uuid = 1;
  string id = 2;
  string name = 3;
  string description = 4;
  string picture = 5;
  bool private = 6;
}

// GroupMembershipRequest covers Join/Leave/AddGroupAdmin/RemoveGroupAdmin/
// RemoveGroupMember. actor_uuid is the caller whose authorization is
// checked server-side; target_uuid is the member being acted on. For
// JoinGroup/LeaveGroup, actor_uuid and target_uuid are the same user acting
// on their own membership.
message GroupMembershipRequest {
  string actor_uuid = 1;
  string group_uuid = 2;
  string target_uuid = 3;
}

// UpdateGroupRequest edits a Group's mutable metadata. actor_uuid must be a
// Group admin or super, per docs/group.md's manage_group permission. id,
// type and private are not editable through this RPC.
message UpdateGroupRequest {
  string actor_uuid = 1;
  string group_uuid = 2;
  string name = 3;
  string description = 4;
  string picture = 5;
}

// ListUserGroupsRequest reads the Groups a user has joined. Streams through
// the user's Follow edges, filtering for Type=="group" Profiles.
message ListUserGroupsRequest {
  string user_uuid = 1;
  int32 limit = 2;   // Max Groups to return (default 100, cap 200)
  string cursor = 3; // Opaque continuation token from previous response
  // Sidebar-only materialized activity order; cursor is not used in this mode.
  bool order_by_activity = 4;
}

// ListUserGroupsResponse returns a page of Groups the user follows.
message ListUserGroupsResponse {
  repeated Profile groups = 1;
  string next_cursor = 2; // Empty when iteration is complete
}

// ListGroups reads the global activity-ordered discovery index. It is public
// metadata and deliberately carries no viewer or relationship state.
message ListGroupsRequest {
  int32 limit = 1;   // default 30, cap 100
  string cursor = 2; // opaque GroupIndex position
}

message ListGroupsResponse {
  repeated Profile groups = 1;
  string next_cursor = 2;
}

// DeleteGroupRequest soft-deletes a Group. actor_uuid must be a Group admin
// or super, per docs/group.md; the last admin may delete the whole Group.
message DeleteGroupRequest {
  string actor_uuid = 1;
  string group_uuid = 2;
}

// GetGroupRequest reads one Group's metadata plus the viewer's relationship.
message GetGroupRequest {
  string group_uuid = 1;
  string viewer_uuid = 2; // session user; empty means anonymous
}

// GroupView is Group metadata plus the viewer's member/admin status, per
// docs/group.md's read contract. It never embeds member lists.
message GroupView {
  Profile group = 1;
  bool is_member = 2;
  bool is_admin = 3;
  // true when the viewer has a pending follow request against this Group.
  bool has_pending_request = 4;
}

// RequestFollow asks to follow a private feed (user feed or Group). The
// actor is the requester; approval comes from the feed owner or a Group
// admin via FollowRequestAction.
message RequestFollowRequest {
  string actor_uuid = 1;
  string feed_uuid = 2;
}

message RequestFollowResponse {
  // true when a pending request now exists; false when the actor already
  // follows the target and no request was needed.
  bool requested = 1;
}

// FollowRequestAction approves or rejects one pending request. actor_uuid
// must be the feed owner (user feed) or a Group admin/super; target_uuid is
// the requester.
message FollowRequestAction {
  string actor_uuid = 1;
  string feed_uuid = 2;
  string target_uuid = 3;
}

// ListFollowRequestsRequest pages the pending requests against one feed.
// actor must be allowed to approve them (owner / Group admin / super).
message ListFollowRequestsRequest {
  string actor_uuid = 1;
  string feed_uuid = 2;
  int32 limit = 3;   // Max requests to return (default 100)
  string cursor = 4; // Opaque continuation token from previous response
}

// FollowRequestItem is one pending request with the requester's Profile.
message FollowRequestItem {
  Profile requester = 1;
  string requested_at = 2;
}

message ListFollowRequestsResponse {
  repeated FollowRequestItem requests = 1;
  string next_cursor = 2; // Empty when iteration is complete
}

message FeedApiKeyManageRequest {
  string actor_uuid = 1;
  string feed_uuid = 2;
}

message FeedApiKeyStatusResponse {
  string feed_uuid = 1;
  bytes key_id = 2;
  int64 created_at_ms = 3;
  int64 rotated_at_ms = 4;
  int64 revoked_at_ms = 5;
  bool active = 6;
}

message FeedApiKeyMutationResponse {
  FeedApiKeyStatusResponse status = 1;
  // Returned exactly once by Generate/Rotate. Never persisted in plaintext.
  string token = 2;
}

message AuthenticateFeedApiKeyRequest {
  string token = 1;
}

message AuthenticateFeedApiKeyResponse {
  string feed_uuid = 1;
  bytes key_id = 2;
}

// ListGroupMembersRequest pages a Group's membership. Follower edges are the
// sole membership source; cursor follows the same contract as
// ListUserGroups (last scanned edge, never a business ID).
message ListGroupMembersRequest {
  string group_uuid = 1;
  int32 limit = 2;   // Max members to return (default 100, cap 200)
  string cursor = 3; // Opaque continuation token from previous response
  string viewer_uuid = 4; // session user; required for private Groups
}

// GroupMember is one member Profile with its admin-role flag.
message GroupMember {
  Profile profile = 1;
  bool is_admin = 2;
}

// ListGroupMembersResponse returns a page of Group members.
message ListGroupMembersResponse {
  repeated GroupMember members = 1;
  string next_cursor = 2; // Empty when iteration is complete
}
