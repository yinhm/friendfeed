root = "."
tmp_dir = "/tmp"

[build]
  bin = "./httpd"
  cmd = "go build"
  delay = 1000
  exclude_dir = ["assets", "tmp", "vendor", "node_modules", "app"]
  exclude_file = []
  exclude_regex = []
  exclude_unchanged = false
  follow_symlink = false
  full_bin = "./httpd -p=8080 -s='randombitsreplacedlkjsa' -c='/srv/ffdev/config.json' -d"
  include_dir = []
  include_ext = ["go", "tpl", "tmpl", "html", 'jsx', 'js']
  kill_delay = "0s"
  log = "build-errors.log"
  send_interrupt = false
  stop_on_error = true

[color]
  app = ""
  build = "yellow"
  main = "magenta"
  runner = "green"
  watcher = "cyan"

[log]
  time = false

[misc]
  clean_on_exit = false
