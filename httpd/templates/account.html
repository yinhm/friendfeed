{% extends "layout.html" %}

{% block content %}

<div id="account-root">
  <noscript>This page requires JavaScript.</noscript>
</div>

{% endblock %}

{% block scripts %}
<script>
window.accountData = {{accountData|safe}};
</script>

{% if dev %}
  {% for filename in jsFiles %}
  <script type="module" src="/app/build/static/js/{{filename}}"></script>
  {% endfor %}
{% else %}
  <script type="module" src="/{{ jsFile }}"></script>
{% endif %}
{% endblock %}
